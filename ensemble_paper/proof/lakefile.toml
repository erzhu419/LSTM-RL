name = "proof"
version = "0.1.0"
defaultTargets = ["proof"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "v4.28.0"

# ─── 通用（根目录） ───
[[lean_lib]]
name = "ApproxContraction"

# ─── RE-SAC ───
[[lean_lib]]
name = "RESAC"
srcDir = "RE-SAC"

[[lean_lib]]
name = "«RESAC-Counterproof»"
srcDir = "RE-SAC"

[[lean_lib]]
name = "SoftBellman"
srcDir = "RE-SAC"

# ─── BA-PR ───
[[lean_lib]]
name = "BAPR"
srcDir = "BAPR"

[[lean_lib]]
name = "«BAPR-Counterproof»"
srcDir = "BAPR"

# ─── BAMOR ───
[[lean_lib]]
name = "BAMOR"
srcDir = "BAMOR"

# ─── AM-HT ───
[[lean_lib]]
name = "AMHT"
srcDir = "AM-HT"

# ─── 可执行入口 ───
[[lean_exe]]
name = "proof"
root = "Main"
